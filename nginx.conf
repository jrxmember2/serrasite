server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Uma única URL canônica: www.dominio -> dominio (TLS termina no proxy à frente).
  if ($host ~* ^www\.(?<apex_domain>.+)$) {
    return 301 https://$apex_domain$request_uri;
  }

  # /sobre/ -> /sobre, para não indexar duas URLs do mesmo conteúdo.
  if ($request_uri ~ ^(/.+)/$) {
    return 301 $1;
  }

  gzip on;
  gzip_types
    text/plain
    text/css
    application/javascript
    application/json
    application/xml
    image/svg+xml;

  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Rotas inexistentes devolvem 404 de verdade, não a home com status 200.
  error_page 404 /404.html;

  location / {
    # $uri.html serve o HTML pré-renderizado de cada rota (/sobre -> sobre.html).
    try_files $uri $uri.html $uri/ =404;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
  }
}
