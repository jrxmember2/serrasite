    <script>
      // Marca que o JS assumiu o motion antes da primeira pintura. Sem isso, o
      // HTML pré-renderizado continua visível — nada depende do JS para ser lido.
      (function () {
        try {
          if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            document.documentElement.classList.add('js-motion');
          }
        } catch (e) {}
      })();
    </script>
